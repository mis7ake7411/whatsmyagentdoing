<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's my agent doing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>">
<style>
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6d6d68;
    --faint: #a3a39d;
    --line: #e4e3dd;
    --thinking: #7c5cdb;
    --tool: #2f7dd1;
    --typing: #1f9d6b;
    --waiting: #d98a0b;
    --done: #5b8a4a;
    --error: #d1453b;
    --idle: #a3a39d;
    --claude: #c96442;
    --codex: #10a37f;
    --gemini: #4f7cf0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --panel: #1e1e1c;
      --ink: #ecebe6;
      --muted: #a09f99;
      --faint: #6b6a65;
      --line: #2e2d2a;
      --thinking: #a48bf0;
      --tool: #5ea4ee;
      --typing: #3fc48f;
      --waiting: #f0a93a;
      --done: #86b872;
      --error: #f0675d;
      --idle: #6b6a65;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 22px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg button small { opacity: .65; font-size: 11px; }
  label.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { color: var(--ink); }

  section { margin-top: 26px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  section h2 .n { color: var(--faint); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .controls { margin-left: 0; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; transition: border-color .3s; }
  .card.sub { padding: 10px 12px; gap: 6px; }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--done); } 100% { box-shadow: var(--shadow); } }
  .card[data-s="waiting"], .card[data-s="error"] { border-color: color-mix(in srgb, var(--s) 55%, var(--line)); }
  .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent { font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 7px; border-radius: 5px; color: #fff; flex: none; }
  .agent.claude { background: var(--claude); }
  .agent.codex { background: var(--codex); }
  .agent.gemini { background: var(--gemini); }
  .project { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .time { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .title { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--s); font-weight: 600; font-size: 13px; min-width: 0; }
  .status .lbl { white-space: nowrap; flex: none; }
  .status .act { flex: 1 1 auto; color: var(--ink); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .evidence { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .evidence p { margin: 3px 0; }
  .evidence .stale { color: var(--waiting); }
  .pending { border-left: 3px solid var(--waiting); padding-left: 9px; font-size: 12.5px; overflow-wrap: anywhere; }
  .pending strong { color: var(--waiting); }
  .pending ul { margin: 4px 0 0; padding-left: 18px; }
  .office-signals { color: var(--muted); font-size: 12px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .office-signals span { display: inline-block; margin: 0 12px 4px 0; }
  .q, .r { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .q::before { content: "› "; color: var(--faint); }
  .r { color: var(--ink); opacity: .85; }
  .r::before { content: "← "; color: var(--faint); }
  .err { font-size: 12.5px; color: var(--error); }
  .foot { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; min-width: 0; }
  .foot .model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy { margin-left: auto; border: 0; background: none; color: var(--faint); font: inherit; font-size: 11.5px; cursor: pointer; padding: 0; flex: none; }
  .copy:hover { color: var(--ink); }

  [data-s="thinking"] { --s: var(--thinking); }
  [data-s="tool"] { --s: var(--tool); }
  [data-s="typing"] { --s: var(--typing); }
  [data-s="waiting"] { --s: var(--waiting); }
  [data-s="done"] { --s: var(--done); }
  [data-s="interrupted"] { --s: var(--idle); }
  [data-s="error"] { --s: var(--error); }
  [data-s="idle"] { --s: var(--idle); }
  [data-s="unknown"] { --s: var(--muted); }

  .ind { width: 18px; height: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; flex: none; }
  .ind i { width: 4px; height: 4px; border-radius: 50%; background: var(--s); display: none; }
  [data-s="thinking"] .ind i { display: block; }
  [data-s="thinking"] .ind i { animation: bob 1.2s infinite ease-in-out; }
  [data-s="thinking"] .ind i:nth-child(2) { animation-delay: .15s; }
  [data-s="thinking"] .ind i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  [data-s="tool"] .ind::before { content: ""; width: 11px; height: 11px; border: 2px solid var(--s); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [data-s="typing"] .ind::before { content: ""; width: 2px; height: 13px; background: var(--s); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  [data-s="waiting"] .ind::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--s); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  [data-s="done"] .ind::before { content: "✓"; color: var(--s); font-weight: 700; }
  [data-s="error"] .ind::before { content: "!"; color: var(--s); font-weight: 800; }
  [data-s="interrupted"] .ind::before { content: "■"; color: var(--s); font-size: 9px; }
  [data-s="idle"] .ind::before { content: "–"; color: var(--s); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .office { position: relative; height: min(74vh, 820px); min-height: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .office-canvas { display: block; }
  .office canvas { transition: opacity .35s; }
  .office.loading canvas { opacity: 0; }
  .office-loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; z-index: 2; }
  .office.loading .office-loader { display: flex; }
  .office-loader .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--tool); border-radius: 50%; animation: spin .8s linear infinite; }
  .office-gl, .office-overlay { position: absolute; inset: 0; }
  .office-overlay { touch-action: none; }
  .tip { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 24px); pointer-events: none; display: none; }
  .tip.pinned { pointer-events: auto; }
  .tip .card { box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .newver { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 18%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; animation: glowv 2.4s ease-in-out infinite; }
  .newver:disabled { opacity: .7; cursor: default; animation: none; }
  @keyframes glowv { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool) 25%, transparent); } }
  .ver { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); z-index: 5; }
  .ver button { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 14%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .ver button:disabled { opacity: .6; cursor: default; }
  .ver code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  .conn { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--error); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; display: none; }
  .conn.on { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👀 <span data-t="title"></span></h1>
    <div class="summary" id="summary"></div>
    <button class="newver" id="newVer" hidden></button>
    <div class="controls">
      <div class="seg" id="viewSeg">
        <button data-v="office" data-t="office"></button>
        <button data-v="list" data-t="list"></button>
      </div>
      <div class="seg" id="qualSeg">
        <button data-v="mid" data-t="qMid"></button>
        <button data-v="high" data-t="qHigh"></button>
      </div>
      <div class="seg" id="sceneSeg" role="group" aria-label="Scene"></div>
      <div class="seg" id="agentSeg">
        <button data-v="all" class="on" data-t="all"></button>
        <button data-v="claude">Claude</button>
        <button data-v="codex">Codex</button>
        <button data-v="gemini">Gemini</button>
      </div>
      <label class="tog"><input type="checkbox" id="showSub"> <span data-t="subagents"></span></label>
      <label class="tog" id="idleToggle"><input type="checkbox" id="showIdle"> <span data-t="showIdle"></span></label>
      <button class="btn" id="notify" data-t="notify"></button>
      <select class="btn" id="langSel" aria-label="Language"></select>
    </div>
  </header>
  <aside id="officeSignals" class="office-signals" aria-live="polite"></aside>
  <div id="officeWrap">
    <div class="office loading" id="office"><div class="office-loader"><div class="spin"></div><span id="loaderText"></span></div></div>
    <div class="legend" id="legend"></div>
  </div>
  <main id="main"></main>
</div>
<div class="conn" id="conn" data-t="disconnected"></div>
<div class="tip" id="tip"></div>
<div class="ver" id="ver"></div>
<script src="/i18n.js"></script>
<script src="/office.js"></script>

<script>
// Language: your pick in the 🌐 menu, else the language of your prompts
// (the server guesses it), else the browser's, else English.
let L = I18N.en;
let langCode = 'en';
let rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
function chooseLang(serverGuess) {
  const pick = store.get('lang', 'auto');
  if (pick !== 'auto' && I18N[pick]) return pick;
  if (serverGuess && I18N[serverGuess]) return serverGuess;
  return i18nFromBrowser(navigator.languages || [navigator.language]) || 'en';
}
function applyLang(code) {
  if (code === langCode && L === I18N[code]) return;
  langCode = code;
  L = I18N[code];
  document.documentElement.lang = L.html;
  rtf = new Intl.RelativeTimeFormat(L.html, { numeric: 'auto', style: 'short' });
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = L[el.dataset.t]));
  const legend = document.getElementById('legend');
  if (legend) legend.innerHTML = ['thinking', 'tool', 'typing', 'waiting', 'done', 'error']
    .map((k) => `<span data-s="${k}"><span class="dot" style="color:var(--s)"></span>${L[k]}</span>`).join('');
  const sel = document.getElementById('langSel');
  if (sel) sel.options[0].textContent = `🌐 ${L.auto}`;
  if (typeof office !== 'undefined' && office) office.offDutyLabel = L.wentHome;
  if (typeof syncControls === 'function') syncControls();
  if (typeof renderSceneSel === 'function') renderSceneSel();
  if (typeof renderVersion === 'function') renderVersion();
}

const store = (() => {
  const get = (k, d) => { try { const v = localStorage.getItem('wmad.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem('wmad.' + k, JSON.stringify(v)); } catch {} };
  return { get, set };
})();

// ?view=office&quality=high&scene=pirate (what `--scene` opens) sets the prefs.
{
  const q = new URLSearchParams(location.search);
  for (const k of ['view', 'quality', 'scene', 'lang']) if (q.get(k)) store.set(k, q.get(k));
  if (location.search) history.replaceState(null, '', location.pathname);
}

const state = {
  view: store.get('view', 'office'),
  quality: store.get('quality', 'mid'),
  scene: store.get('scene', 'office'),
  scenes: [],
  agent: store.get('agent', 'all'),
  showSub: store.get('showSub', false),
  showIdle: store.get('showIdle', false),
  data: { now: Date.now(), sessions: [] },
  skew: 0,
  prev: new Map(),
  flash: new Set(),
};

const ACTIVE = new Set(['thinking', 'tool', 'typing']);
const AGENT_NAME = { claude: 'Claude', codex: 'Codex', gemini: 'Gemini' };
const needsInput = (s) => s.needsInput || s.status === 'waiting' || (s.pendingRequests || []).length > 0;
function groupOf(s) {
  if (needsInput(s)) return 'needsYou';
  if (s.status === 'error') return 'errors';
  if (ACTIVE.has(s.status)) return 'working';
  if (s.status === 'done' || s.status === 'interrupted') return 'finished';
  return s.status === 'idle' ? 'idle' : 'unknown';
}
const GROUPS = [
  { key: 'needsYou', color: 'waiting' },
  { key: 'working', color: 'tool' },
  { key: 'finished', color: 'done' },
  { key: 'errors', color: 'error' },
  { key: 'unknown', color: 'muted' },
  { key: 'idle', color: 'idle' },
];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

function ago(t, now) {
  const s = Math.round((t - now) / 1000);
  if (s > -45) return rtf.format(0, 'second');
  const m = Math.round(s / 60);
  if (m > -60) return rtf.format(m, 'minute');
  const h = Math.round(m / 60);
  if (h > -24) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

function timeLabel(s, now) {
  if ((ACTIVE.has(s.status) || s.status === 'waiting') && s.turnStartedAt) return dur(now - s.turnStartedAt);
  return s.lastEventAt ? ago(s.lastEventAt, now) : '';
}

function freshness(s, now) {
  const hasTime = Number.isFinite(s.lastEventAt) && s.lastEventAt > 0;
  const quiet = hasTime ? Math.max(0, now - s.lastEventAt) : null;
  const terminal = ['done', 'interrupted', 'error', 'idle'].includes(s.status);
  return { quiet, stale: !terminal && quiet !== null && quiet >= (s.staleAfterMs || 600000) };
}

function evidence(s, now) {
  const info = freshness(s, now);
  const logTime = info.quiet === null ? L.logTimeUnknown : L.lastLog(dur(info.quiet));
  const stale = info.stale ? `<p class="stale">${esc(L.staleLog(dur(info.quiet)))} ${esc(L.staleMeaning)}</p>` : '';
  return `<div class="evidence"><p>${esc(logTime)}</p>${stale}</div>`;
}

function pending(s) {
  if (!needsInput(s)) return '';
  const requests = s.pendingRequests || [];
  const items = requests.filter((r) => r.summary).map((r) => `<li>${esc(r.summary)}</li>`).join('');
  return `<div class="pending"><strong>${esc(L.pendingCount(requests.length || 1))}</strong>${items ? `<ul>${items}</ul>` : ''}</div>`;
}

// Single-quote for POSIX shells: inside '…' nothing ($(), backticks, $VAR)
// is expanded, so a folder or session name can't run anything when pasted.
const shq = (v) => `'${String(v).replace(/'/g, `'\\''`)}'`;
function resumeCmd(s) {
  const cd = s.cwd ? `cd ${shq(s.cwd)} && ` : '';
  if (s.agent === 'claude') return `${cd}claude --resume ${shq(s.id)}`;
  if (s.agent === 'gemini') return `${cd}gemini --resume ${shq(s.sessionId || s.id)}`;
  return `${cd}codex resume ${shq(s.id)}`;
}

function card(s, now) {
  const project = s.project || (s.cwd ? s.cwd : '—');
  const title = s.title && s.title !== project ? `<div class="title" title="${esc(s.title)}">${esc(s.title)}</div>` : '';
  const act = s.activity ? `<span class="act" title="${esc(s.activity)}">${esc(s.activity)}</span>` : '';
  const showText = !s.subagent || ACTIVE.has(s.status);
  const q = showText && s.prompt ? `<div class="q" title="${esc(s.prompt)}">${esc(s.prompt)}</div>` : '';
  const r = showText && s.reply && !ACTIVE.has(s.status) ? `<div class="r" title="${esc(s.reply)}">${esc(s.reply)}</div>` : '';
  const err = s.error ? `<div class="err">${esc(s.error)}</div>` : '';
  const sub = s.subagent ? ` · ${L.sub}` : '';
  return `
  <div class="card${s.subagent ? ' sub' : ''}${state.flash.has(s.key) ? ' flash' : ''}" data-s="${s.status}" data-key="${esc(s.key)}">
    <div class="top">
      <span class="agent ${s.agent}">${AGENT_NAME[s.agent] || s.agent}</span>
      <span class="project" title="${esc(s.cwd)}">${esc(project)}</span>
      <span class="time" data-time="${esc(s.key)}">${esc(timeLabel(s, now))}</span>
    </div>
    ${title}
    <div class="status" title="${esc(L.observedStatus)}"><span class="ind"><i></i><i></i><i></i></span><span class="lbl">${esc(L[s.status] || L.unknown)}</span>${act}</div>
    ${pending(s)}${evidence(s, now)}${err}${q}${r}
    <div class="foot"><span class="model">${esc((s.model || '') + sub)}</span><button class="copy" data-copy="${esc(resumeCmd(s))}">${L.copy}</button></div>
  </div>`;
}

function visible() {
  return state.data.sessions.filter((s) =>
    (state.agent === 'all' || s.agent === state.agent) &&
    (state.showSub || !s.subagent) &&
    (state.showIdle || s.status !== 'idle' || needsInput(s)));
}

function render() {
  const now = Date.now() - state.skew;
  const list = visible();
  const all = state.data.sessions.filter((s) => (state.agent === 'all' || s.agent === state.agent) && (state.showSub || !s.subagent));

  const count = (key) => all.filter((s) => groupOf(s) === key).length;
  document.getElementById('summary').innerHTML = GROUPS.filter((g, i) => i < 3 || (g.key !== 'idle' && count(g.key))).map((g) => {
    const n = count(g.key);
    const color = `var(--${g.color})`;
    return `<span class="chip"><span class="dot" style="color:${color}"></span>${L[g.key]} <b>${n}</b></span>`;
  }).join('');

  const working = count('working');
  const needs = count('needsYou');
  document.title = (needs ? `(${needs}!) ` : working ? `(${working}) ` : '') + L.title;

  const main = document.getElementById('main');
  const officeMode = state.view === 'office';
  document.getElementById('officeWrap').style.display = officeMode ? '' : 'none';
  // The office decides who sits at a desk and who wanders around.
  // Unknown is not a resting agent. Keep it in the evidence summary/List;
  // pending input uses the existing waving animation without overwriting data.
  const officeList = all.filter((s) => s.status !== 'unknown' || needsInput(s))
    .map((s) => needsInput(s) ? { ...s, status: 'waiting' } : s);
  const staleCount = all.filter((s) => freshness(s, now).stale).length;
  document.getElementById('officeSignals').innerHTML = officeMode ? [
    `<span>${esc(L.observedStatus)}</span>`,
    staleCount ? `<span>${esc(L.staleCount(staleCount))} ${esc(L.staleMeaning)}</span>` : '',
    count('unknown') ? `<span>${esc(L.unknown)}: ${count('unknown')} · ${esc(L.unknownOffice)}</span>` : '',
  ].join('') : '';
  // Wait for the first snapshot so people start at their places instead of
  // all walking in through the door.
  if (office && state.loaded) {
    office.setVisible(officeMode);
    office.update(officeList);
  }
  document.getElementById('idleToggle').style.display = officeMode ? 'none' : '';
  if (officeMode) {
    main.innerHTML = all.length ? '' : `<div class="empty">${esc(L.empty)}</div>`;
    document.getElementById('officeWrap').style.display = all.length ? '' : 'none';
    refreshTip();
    return;
  }
  if (!list.length) {
    main.innerHTML = `<div class="empty">${esc(L.empty)}</div>`;
    return;
  }
  main.innerHTML = GROUPS.map((g) => {
    const items = list.filter((s) => groupOf(s) === g.key);
    if (!items.length) return '';
    return `<section><h2>${L[g.key]} <span class="n">${items.length}</span></h2><div class="grid">${items.map((s) => card(s, now)).join('')}</div></section>`;
  }).join('');
}

function tickTimes() {
  if (tipKey) refreshTip();
  const now = Date.now() - state.skew;
  const byKey = new Map(state.data.sessions.map((s) => [s.key, s]));
  document.querySelectorAll('[data-time]').forEach((el) => {
    const s = byKey.get(el.dataset.time);
    if (s) el.textContent = timeLabel(s, now);
  });
}

function onData(data) {
  state.skew = Date.now() - data.now;
  const first = state.prev.size === 0;
  state.flash.clear();
  for (const s of data.sessions) {
    const before = state.prev.get(s.key);
    const pendingIds = (s.pendingRequests || []).map((r) => r.id);
    const newlyNeeds = needsInput(s) && (!before?.needsInput || pendingIds.some((id) => !before.pendingIds.includes(id)));
    const newlyDone = s.status === 'done' && before && before.status !== 'done';
    if (!first && before && (newlyDone || newlyNeeds)) {
      state.flash.add(s.key);
      if (!s.subagent && window.Notification && Notification.permission === 'granted') {
        try { new Notification(newlyNeeds ? `${s.project || s.agent}: ${L.waiting}` : L.doneNote(s.project || s.agent), { body: newlyNeeds ? (s.pendingRequests || []).map((r) => r.summary).filter(Boolean).join('\n') : s.reply || '', tag: s.key }); } catch {}
      }
    }
    state.prev.set(s.key, { status: s.status, needsInput: needsInput(s), pendingIds });
  }
  state.data = data;
  state.loaded = true;
  applyLang(chooseLang(data.lang));
  render();
}

function connect() {
  const es = new EventSource('/events');
  const conn = document.getElementById('conn');
  es.onmessage = (e) => { conn.classList.remove('on'); onData(JSON.parse(e.data)); };
  es.onerror = () => conn.classList.add('on');
}

document.getElementById('qualSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.quality = b.dataset.v; store.set('quality', state.quality); hideTip(); syncControls(); makeOffice();
});
document.getElementById('viewSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.v; store.set('view', state.view); hideTip(); syncControls(); render();
});
document.getElementById('agentSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.agent = b.dataset.v; store.set('agent', state.agent); syncControls(); render();
});
const showSub = document.getElementById('showSub');
const showIdle = document.getElementById('showIdle');
showSub.addEventListener('change', () => { state.showSub = showSub.checked; store.set('showSub', state.showSub); render(); });
showIdle.addEventListener('change', () => { state.showIdle = showIdle.checked; store.set('showIdle', state.showIdle); render(); });

const notifyBtn = document.getElementById('notify');
function syncControls() {
  document.querySelectorAll('#agentSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.agent));
  document.querySelectorAll('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.view));
  document.querySelectorAll('#qualSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.quality));
  document.getElementById('qualSeg').style.display = state.view === 'office' ? '' : 'none';
  const ss = document.getElementById('sceneSeg');
  if (ss) ss.style.display = state.view === 'office' && state.quality === 'high' ? '' : 'none';
  showSub.checked = state.showSub;
  showIdle.checked = state.showIdle;
  if (!window.Notification) notifyBtn.style.display = 'none';
  else if (Notification.permission === 'granted') { notifyBtn.textContent = L.notifyOn; notifyBtn.disabled = true; }
}
notifyBtn.addEventListener('click', () => Notification.requestPermission().then(syncControls));

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => {
    b.textContent = L.copied; setTimeout(() => (b.textContent = L.copy), 1400);
  });
});

// ---- office view
const tip = document.getElementById('tip');
let tipKey = null, tipPinned = false, tipAt = { x: 0, y: 0 };
function placeTip() {
  const r = tip.getBoundingClientRect();
  let x = tipAt.x + 16, y = tipAt.y + 16;
  if (x + r.width > innerWidth - 8) x = tipAt.x - r.width - 16;
  if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = y + 'px';
}
function refreshTip() {
  if (!tipKey) return;
  const s = state.data.sessions.find((x) => x.key === tipKey);
  if (!s) return hideTip();
  tip.innerHTML = card(s, Date.now() - state.skew);
  placeTip();
}
function hideTip() { tipKey = null; tipPinned = false; tip.style.display = 'none'; tip.classList.remove('pinned'); }
const officeOpts = {
  label: (s) => s.project || AGENT_NAME[s.agent] || s.agent,
  onHover(s, at, click) {
    if (click) {
      if (!s) return hideTip();
      tipPinned = true; tip.classList.add('pinned');
    } else if (tipPinned) return;
    if (!s) { if (!tipPinned) hideTip(); return; }
    tipKey = s.key; tipAt = at;
    tip.style.display = 'block';
    refreshTip();
  },
};
let office = null;
let officeKind = null;
// The 3D office (three.js + models) is only fetched when someone picks it.
// Until the new office has drawn a settled frame, show a loader instead of a
// half-built scene.
const officeEl = document.getElementById('office');
function setLoading(on, text) {
  officeEl.classList.toggle('loading', on);
  if (text) document.getElementById('loaderText').textContent = text;
}
async function makeOffice() {
  const high = state.quality === 'high';
  const scene = high && state.scene !== 'office' && state.scenes.some((x) => x.id === state.scene) ? state.scene : 'office';
  const kind = high ? `high:${scene}` : 'mid';
  if (kind === officeKind) return;
  officeKind = kind;
  setLoading(true, high ? L.loading3d : L.loading2d);
  let Cls = window.Office;
  const opts = { ...officeOpts };
  if (high) {
    try {
      Cls = (await import('/office3d.js')).Office3D;
      if (scene !== 'office') {
        const m = await fetch(`/scenes/${scene}/manifest.json`).then((r) => r.json());
        opts.scene = { ...m, base: `/scenes/${scene}/` };
      }
    } catch (e) { console.error(e); Cls = window.Office; }
    if (officeKind !== kind) return;
  }
  if (office) office.destroy();
  let mine;
  try {
    mine = new Cls(officeEl, opts);
  } catch (e) {
    console.error(e);
    mine = new window.Office(officeEl, officeOpts);
    if (kind === 'high') { state.quality = 'mid'; store.set('quality', 'mid'); officeKind = 'mid'; syncControls(); }
  }
  office = mine;
  office.offDutyLabel = L.wentHome;
  render();
  const ok = await mine.ready;
  if (office !== mine) return;
  if (!ok && kind === 'high') {
    // 3D failed (no WebGL, missing files…): fall back to the 2D office.
    setLoading(true, L.failed3d);
    state.quality = 'mid'; store.set('quality', 'mid'); syncControls();
    setTimeout(() => makeOffice(), 1200);
    return;
  }
  setLoading(false);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });

// Scenes (3D only): the built-in office plus any installed scene packs.
const sceneSel = document.getElementById('sceneSeg');
state.available = [];
function renderSceneSel() {
  const name = (x) => (x.name && (x.name[langCode] || x.name.en)) || x.id;
  const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
  const current = state.scenes.some((x) => x.id === state.scene) ? state.scene : 'office';
  const btn = (v, label, title = '') =>
    `<button data-v="${esc(v)}" class="${v === current ? 'on' : ''}"${title ? ` title="${esc(title)}"` : ''}>${label}</button>`;
  sceneSel.innerHTML = btn('office', `🏢 ${esc(L.office)}`) +
    state.scenes.map((x) => btn(x.id, `${esc(x.icon || '🗺️')} ${esc(name(x))}`, x.credits || '')).join('') +
    state.available.map((x) => btn(`dl:${x.id}`, `⬇ ${esc(x.icon || '')} ${esc(name(x))} <small>${kb(x.size)}</small>`, `${L.dl} ${kb(x.size)}`)).join('');
}
function loadScenes() {
  return fetch('/api/scenes').then((r) => r.json()).then((d) => {
    state.scenes = d.installed || [];
    state.available = d.available || [];
    renderSceneSel();
  }).catch(() => {});
}
sceneSel.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || b.classList.contains('on') || sceneSel.dataset.busy) return;
  let id = b.dataset.v;
  hideTip();
  if (id.startsWith('dl:')) {
    // A scene pack: download it (the server checks its checksum), then switch.
    id = id.slice(3);
    sceneSel.dataset.busy = '1';
    setLoading(true, L.installing);
    const r = await fetch(`/api/scenes/install?id=${encodeURIComponent(id)}`, { method: 'POST', headers: { 'x-whatsmyagentdoing': 'install' } })
      .then((x) => x.json()).catch(() => ({ ok: false }));
    await loadScenes();
    delete sceneSel.dataset.busy;
    if (!r.ok) { setLoading(true, L.installFailed); setTimeout(() => setLoading(false), 2000); renderSceneSel(); return; }
  }
  state.scene = id; store.set('scene', id); renderSceneSel(); makeOffice();
});
// Know the installed scenes before building the first office, so a saved
// scene choice doesn't build the default office first and then swap.
const scenesReady = loadScenes();

// ---- version + one-click update
const verEl = document.getElementById('ver');
let verInfo = null;
function renderVersion() {
  if (!verInfo) return;
  let html = `<span>v${esc(verInfo.version)}</span>`;
  if (verInfo.updateAvailable) {
    html = verInfo.canUpdate
      ? `<button id="updBtn">⬆ ${esc(L.update)} v${esc(verInfo.latest)}</button>` + html
      : `<span>${esc(L.gitPull)} → v${esc(verInfo.latest)}</span>` + html;
  }
  verEl.innerHTML = html;
  // a second, more visible way in, next to the title
  const top = document.getElementById('newVer');
  top.hidden = !(verInfo.updateAvailable && verInfo.canUpdate);
  if (!top.hidden && !top.disabled) top.textContent = `⬆ ${L.newVersion} v${verInfo.latest}`;
  top.onclick = () => { const b2 = document.getElementById('updBtn'); if (b2) { top.disabled = true; top.textContent = L.updating; b2.click(); } };
  const b = document.getElementById('updBtn');
  if (b) b.onclick = async () => {
    b.disabled = true; b.textContent = L.updating;
    const r = await fetch('/api/update', { method: 'POST', headers: { 'x-whatsmyagentdoing': 'update' } }).then((x) => x.json()).catch(() => ({ ok: false }));
    if (!r.ok) { b.textContent = `${L.updateFailed}${r.error ? ': ' + r.error : ''}`; setTimeout(renderVersion, 4000); return; }
    b.textContent = L.updated;
    // the server restarts itself; reload once it answers again
    const t0 = Date.now();
    const wait = setInterval(() => {
      fetch('/api/version', { cache: 'no-store' }).then((x) => x.json()).then((v) => {
        if (v.version !== verInfo.version || Date.now() - t0 > 20000) { clearInterval(wait); location.reload(); }
      }).catch(() => {});
    }, 1000);
  };
}
function loadVersion() {
  fetch('/api/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => { verInfo = v; renderVersion(); }).catch(() => {});
}
loadVersion();
setInterval(loadVersion, 30 * 60 * 1000);

const langSel = document.getElementById('langSel');
langSel.innerHTML = '<option value="auto"></option>' +
  Object.entries(I18N).map(([k, v]) => `<option value="${k}">${v.langName}</option>`).join('');
langSel.value = store.get('lang', 'auto');
langSel.addEventListener('change', () => {
  store.set('lang', langSel.value);
  applyLang(chooseLang(state.data.lang));
  render();
});
applyLang(chooseLang(null));
syncControls();
scenesReady.then(() => makeOffice());
connect();
setInterval(tickTimes, 1000);
</script>
</body>
</html>
